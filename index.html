<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- Política de seguridad: solo recursos propios + fotos de los hosts listados. Debe coincidir con _headers (hay un test). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://images.cluvi.com https://images-mini.cluvi.com; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Barbecue Garage | Inicio</title>
    <meta
      name="description"
      content="Barbecue Garage (Cra 21 y Le Meridiem Golf): burgers, hot dogs, sandwiches y cortes de carne al carbón. Mira la carta, encuentra tu sede o pide a domicilio por WhatsApp."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Barbecue Garage | Smoked burgers &amp; meats" />
    <meta property="og:description" content="Conoce nuestras sedes, mira la carta o pide a domicilio por WhatsApp." />
    <meta property="og:locale" content="es_CO" />

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <script type="module" src="js/pages/home.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header id="site-header" class="site-header"></header>

    <main id="contenido">
      <section class="hero" aria-labelledby="hero-title">
        <div class="container hero__inner">
          <img
            class="hero__logo"
            src="https://images-mini.cluvi.com/JB2A91gDlj/thumb_JB2A91gDlj_x9cjkengze_logo-header.png"
            alt="Logo de Barbecue Garage"
            width="168"
            height="168"
            decoding="async"
            referrerpolicy="no-referrer"
          />
          <p class="eyebrow" data-site="tagline">Smoked burgers &amp; meats</p>
          <h1 id="hero-title" class="hero__title">
            <span data-site="name">Barbecue Garage</span>
            <span class="hero__branch" data-site="branch">Cra 21 · Le Meridiem Golf</span>
          </h1>
          <p class="hero__lead" data-site="description">
            Burgers, hot dogs, sandwiches y cortes de carne al carbón, con ahumados de cocción lenta.
          </p>
        </div>
      </section>
      <div class="stripe" aria-hidden="true"></div>

      <section class="section" aria-labelledby="tiles-title">
        <div class="container">
          <div class="section__head">
            <h2 id="tiles-title" class="section__title">¿Qué quieres hacer hoy?</h2>
          </div>
          <div id="home-tiles" class="tiles"></div>
          <noscript>
            <p class="state state--error">Para usar el sitio necesitas activar JavaScript en tu navegador.</p>
          </noscript>
        </div>
      </section>

    </main>

    <footer id="site-footer" class="site-footer"></footer>
  </body>
</html>
